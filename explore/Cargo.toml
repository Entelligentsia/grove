[package]
name = "grove-explore-core"
version = "0.5.0"
edition = "2021"
description = "The mcp-llm inner explorer subsystem for grove — LLM config, transport, tool dispatch, agent loop, and health probing."
license = "MIT"
repository = "https://github.com/Entelligentsia/grove"
homepage = "https://github.com/Entelligentsia/grove"

[lib]
name = "grove_explore_core"

[dependencies]
# Core structural library (ops, config types, registry).
grove-cst = { path = "../core", version = "=0.5.0" }

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for health probing + chat completions (blocking, rustls).
ureq = "3"

# Error handling.
anyhow = "1"

# OS-native config directories (ExploreConfig::config_path).
dirs = "5"
